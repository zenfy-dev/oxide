name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, appimage_arch: x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, appimage_arch: aarch64 }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-13, target: x86_64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libfuse2 file

      # Release binaries include RAR extraction (UnRAR licence shipped alongside).
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --workspace --features oxide-core/rar

      - name: Package (Linux tarball + AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release
          STAGE=dist/oxide-$VERSION-${{ matrix.name }}
          mkdir -p "$STAGE"
          cp $BIN/oxide $BIN/oxide-gui README.md LICENSE-MIT LICENSE-APACHE licenses/UnRAR-license.txt "$STAGE/"
          cp packaging/linux/oxide.desktop assets/icon-256.png "$STAGE/"
          tar -C dist -czf "$STAGE.tar.gz" "$(basename "$STAGE")"

          APPDIR=dist/Oxide.AppDir
          mkdir -p $APPDIR/usr/bin $APPDIR/usr/share/applications $APPDIR/usr/share/icons/hicolor/256x256/apps
          cp $BIN/oxide $BIN/oxide-gui $APPDIR/usr/bin/
          cp packaging/linux/oxide.desktop $APPDIR/usr/share/applications/
          cp packaging/linux/oxide.desktop $APPDIR/
          cp assets/icon-256.png $APPDIR/usr/share/icons/hicolor/256x256/apps/oxide.png
          cp assets/icon-256.png $APPDIR/oxide.png
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/oxide-gui" "$@"\n' > $APPDIR/AppRun
          chmod +x $APPDIR/AppRun
          ARCH=${{ matrix.appimage_arch }}
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$ARCH.AppImage"
          chmod +x appimagetool
          ARCH=$ARCH ./appimagetool --appimage-extract-and-run $APPDIR "dist/Oxide-$VERSION-$ARCH.AppImage"

      - name: Package (macOS app bundle + DMG)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release
          APP=dist/Oxide.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp $BIN/oxide-gui $BIN/oxide $APP/Contents/MacOS/
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > $APP/Contents/Info.plist
          ICONSET=dist/Oxide.iconset
          mkdir -p $ICONSET
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-1024.png --out $ICONSET/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon-1024.png --out $ICONSET/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns $ICONSET -o $APP/Contents/Resources/Oxide.icns
          cp LICENSE-MIT LICENSE-APACHE licenses/UnRAR-license.txt $APP/Contents/Resources/
          # Ad-hoc signature so Apple Silicon will launch it; not notarized.
          codesign --force --deep --sign - $APP
          hdiutil create -volname Oxide -srcfolder $APP -ov -format UDZO "dist/Oxide-$VERSION-${{ matrix.name }}.dmg"
          tar -C $BIN -czf "dist/oxide-cli-$VERSION-${{ matrix.name }}.tar.gz" oxide
          rm -rf $APP $ICONSET

      - name: Package (Windows portable zip + installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release"
          $stage = "dist/oxide-$env:VERSION-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$bin/oxide.exe","$bin/oxide-gui.exe","README.md","LICENSE-MIT","LICENSE-APACHE","licenses/UnRAR-license.txt" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DAppVersion=$env:VERSION "/DSourceDir=$((Resolve-Path $bin).Path)" /O"$((Resolve-Path dist).Path)" packaging/windows/oxide.iss
          Remove-Item -Recurse $stage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
