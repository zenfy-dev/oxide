[workspace]
resolver = "3"
members = ["crates/oxide-core", "crates/oxide-cli", "crates/oxide-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zenfy-dev/oxide"
rust-version = "1.95"

[workspace.dependencies]
oxide-core = { path = "crates/oxide-core", version = "0.1.0" }
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Compression codecs are painfully slow unoptimised; keep tests fast.
[profile.dev.package."*"]
opt-level = 2
