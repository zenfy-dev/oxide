[package]
name = "oxide-core"
description = "Archive engine for Oxide: format detection, safe extraction, and creation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["sevenz"]
sevenz = ["dep:sevenz-rust2"]
rar = ["dep:unrar"]

[dependencies]
zip = { version = "9.1.3", default-features = false, features = ["aes-crypto", "deflate", "bzip2", "zstd", "lzma", "xz", "chrono"] }
tar = "0.4.46"
flate2 = "1.1.10"
zstd = { version = "0.14.3", features = ["zstdmt"] }
liblzma = { version = "0.4.9", features = ["static", "parallel"] }
bzip2 = "0.6.1"
walkdir = "2.5.0"
sevenz-rust2 = { version = "0.24.1", optional = true }
unrar = { version = "0.5.8", optional = true }
zeroize = "1.9.1"
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
chrono.workspace = true
tempfile.workspace = true

[dev-dependencies]
serde_json.workspace = true
tar = "0.4.46"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
