[package]
name = "oxide-gui"
description = "Desktop archive manager built on oxide-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxide-gui"
path = "src/main.rs"

[features]
default = ["sevenz"]
sevenz = ["oxide-core/sevenz"]
rar = ["oxide-core/rar"]

[dependencies]
oxide-core = { workspace = true, default-features = false }
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
rfd = "0.17.2"
anyhow.workspace = true
serde.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSURL", "NSString", "objc2-core-services"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
