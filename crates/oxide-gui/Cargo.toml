[package]
name = "oxide-gui"
description = "Desktop archive manager built on oxide-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxide-gui"
path = "src/main.rs"

[features]
default = ["sevenz"]
sevenz = ["oxide-core/sevenz"]
rar = ["oxide-core/rar"]

[dependencies]
oxide-core = { workspace = true, default-features = false }
eframe = "0.37.0"
egui_extras = "0.37.0"
rfd = "0.17.2"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSURL", "NSString", "objc2-core-services"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
